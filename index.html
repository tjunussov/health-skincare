<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Skin Routine"><meta name="theme-color" content="#f2f2f7"><title>Skin Routine</title><style>:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#8e8e93;--line:#e5e5ea;--blue:#0a84ff;--green:#30d158}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--text);padding-bottom:40px}.app{max-width:540px;margin:auto}.header{padding:calc(20px + env(safe-area-inset-top)) 20px 10px}.eyebrow{font-size:14px;color:var(--muted);font-weight:700}h1{font-size:36px;margin:5px 0 6px;letter-spacing:-.04em}.today{font-size:17px;color:var(--muted)}.progress{margin:12px 16px 18px;background:var(--card);border-radius:24px;padding:20px;display:flex;align-items:center;gap:18px}.ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--p),#e5e5ea 0);position:relative}.ring:before{content:"";position:absolute;width:62px;height:62px;border-radius:50%;background:var(--card)}.ring b{position:relative;font-size:21px}.progress h2{margin:0 0 4px;font-size:22px}.progress p{margin:0;color:var(--muted)}.nav{display:flex;gap:8px;padding:0 16px 12px;overflow:auto}.nav button{border:0;background:#e5e5ea;padding:11px 15px;border-radius:14px;font-size:16px;font-weight:700}.nav button.on{background:#111;color:#fff}.content{padding:0 16px}.title{font-size:13px;color:var(--muted);font-weight:700;margin:20px 4px 8px;text-transform:uppercase}.list{background:var(--card);border-radius:20px;overflow:hidden}.todo{min-height:78px;padding:13px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);font-size:20px;line-height:1.2}.todo:last-child{border:0}.check{width:32px;height:32px;border:2px solid #c7c7cc;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}.done .check{background:var(--green);border-color:var(--green)}.done .txt{text-decoration:line-through;color:#aaa}.note{margin:20px 16px;background:var(--card);padding:16px;border-radius:18px;color:var(--muted);font-size:14px;line-height:1.4}@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--line:#38383a}.nav button{background:#2c2c2e;color:#ddd}}</style></head><body><div class="app"><header class="header"><div class="eyebrow">SKIN ROUTINE</div><h1>Уход за кожей</h1><div class="today" id="today"></div></header><section class="progress"><div class="ring" id="ring" style="--p:0%"><b id="count">0/6</b></div><div><h2 id="day"></h2><p id="type"></p></div></section><nav class="nav" id="nav"></nav><main class="content" id="content"></main><div class="note">Тонер Medi-Peel — опционально. Hyaluronic Acid 2% + B5 — при сухости. Retinol 1% и Salicylic Acid 2% не используй в один вечер.</div></div><script>const full=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],short=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],am=['Medi-Peel Cleanser','Anua Niacinamide 10% + TXA 4%','SKIN1004 SPF50+ serum'],P={1:['Retinol',['Medi-Peel Cleanser','The Ordinary Retinol 1% in Squalane','Увлажнение — при необходимости']],2:['BHA',['Medi-Peel Cleanser','The Ordinary Salicylic Acid 2%','Увлажнение — при необходимости']],3:['Recovery',['Medi-Peel Cleanser','Medi-Peel Toner — опционально','Hyaluronic Acid 2% + B5 — по необходимости']],4:['Retinol',['Medi-Peel Cleanser','The Ordinary Retinol 1% in Squalane','Увлажнение — при необходимости']],5:['BHA',['Medi-Peel Cleanser','The Ordinary Salicylic Acid 2%','Увлажнение — при необходимости']],6:['Recovery',['Medi-Peel Cleanser','Medi-Peel Toner — опционально','Hyaluronic Acid 2% + B5 — по необходимости']],0:['Retinol',['Medi-Peel Cleanser','The Ordinary Retinol 1% in Squalane','Увлажнение — при необходимости']]};let sel=new Date().getDay();const k=(d,s,i)=>`skin-${d}-${s}-${i}`,ck=(d,s,i)=>localStorage.getItem(k(d,s,i))==='1';function tog(d,s,i){localStorage.setItem(k(d,s,i),ck(d,s,i)?'0':'1');render()}function item(d,s,i,x){let z=ck(d,s,i);return `<div class="todo ${z?'done':''}" onclick="tog(${d},'${s}',${i})"><div class="check">${z?'✓':''}</div><div class="txt">${x}</div></div>`}function render(){let p=P[sel],flags=[...am.map((_,i)=>ck(sel,'am',i)),...p[1].map((_,i)=>ck(sel,'pm',i))],n=flags.filter(Boolean).length,total=flags.length;day.textContent=full[sel];type.textContent=p[0]==='BHA'?'Вечером — салициловая кислота':p[0]==='Retinol'?'Вечером — ретинол':'Вечером — восстановление';count.textContent=`${n}/${total}`;ring.style.setProperty('--p',`${n/total*100}%`);content.innerHTML=`<div class="title">Утро</div><div class="list">${am.map((x,i)=>item(sel,'am',i,x)).join('')}</div><div class="title">Вечер</div><div class="list">${p[1].map((x,i)=>item(sel,'pm',i,x)).join('')}</div>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',+b.dataset.d===sel))}for(let d of [1,2,3,4,5,6,0]){let b=document.createElement('button');b.textContent=short[d];b.dataset.d=d;b.onclick=()=>{sel=d;render()};nav.appendChild(b)}today.textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});render()</script></body></html>
